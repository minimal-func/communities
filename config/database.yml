default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

development:
  <<: *default
  database: communities_development

test:
  <<: *default
  database: communities_test

production:
  primary:
    <<: *default
    database: communities_production
  cache:
    <<: *default
    database: communities_production_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: communities_production_cable
    migrations_paths: db/cable_migrate
